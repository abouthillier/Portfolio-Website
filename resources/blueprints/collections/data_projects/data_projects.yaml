title: 'Data Project'
sections:
  main:
    display: Main
    fields:
      -
        handle: title
        field:
          type: text
          required: true
          validate:
            - required
      -
        handle: featured_visualization
        field:
          type: assets
          container: assets
          max_files: 1
          mode: grid
          display: 'Featured Visualization'
          instructions: 'Screenshot or chart hero image. Can be added later.'
      -
        handle: description
        field:
          type: markdown
          display: Description
          instructions: '2–4 sentences, first person — what data problem this solves.'
          validate:
            - required
      -
        handle: tools_used
        field:
          type: terms
          taxonomies:
            - tools_used
          display: 'Tools & Technologies'
      -
        handle: data_source
        field:
          type: markdown
          display: 'Data Source'
          instructions: 'Short bullet list of inputs (APIs, files, logs, sensors).'
          validate:
            - required
      -
        handle: key_findings
        field:
          type: grid
          display: 'Key Findings'
          instructions: '2–3 rows max. Each row is a data insight or pipeline capability, not a feature tour.'
          add_row: 'Add Finding'
          fields:
            -
              handle: finding
              field:
                type: text
                display: Finding
            -
              handle: description
              field:
                type: textarea
                display: Description
            -
              handle: visualization
              field:
                type: assets
                container: assets
                max_files: 1
                mode: grid
                display: Visualization
                instructions: 'Optional chart or screenshot for this finding.'
      -
        handle: methodology
        field:
          type: markdown
          display: Methodology
          instructions: '3–5 bullets: ingestion, storage, aggregation, visualization.'
