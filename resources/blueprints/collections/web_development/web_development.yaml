title: 'Web Development Project'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: featured_image
            field:
              type: assets
              container: assets
              max_files: 1
              mode: grid
              validate:
                - required
          -
            handle: hero_video
            field:
              type: assets
              container: assets
              max_files: 2
              mode: grid
              display: 'Hero Video (wide layout)'
              instructions: 'Optional looping WebM/MP4 for wide cards. Uses featured image as poster.'
              allowed_types:
                - mp4
                - webm
              if:
                wide_layout: true
          -
            handle: description
            field:
              type: markdown
              display: Description
              validate:
                - required
          -
            handle: description_secondary
            field:
              type: markdown
              display: 'Secondary description (wide layout)'
              instructions: 'Right-column copy for wide cards — bullets, call-outs, or extra detail.'
              if:
                wide_layout: true
          -
            handle: technologies
            field:
              type: terms
              taxonomies:
                - technologies
              display: 'Technologies Used'
          -
            handle: platform
            field:
              type: terms
              display: Platform
              taxonomies:
                - platform
          -
            handle: github_url
            field:
              type: text
              display: 'GitHub URL'
          -
            handle: live_url
            field:
              type: text
              display: 'Live Site URL'
          -
            handle: features
            field:
              type: grid
              display: 'Key Features'
              add_row: 'Add Feature'
              fields:
                -
                  handle: feature
                  field:
                    type: text
                    display: Feature
                -
                  handle: description
                  field:
                    type: textarea
                    display: Description
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: wide_layout
            field:
              type: toggle
              display: 'Wide layout'
              instructions: 'Span two columns with video hero and split title/content layout.'
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
