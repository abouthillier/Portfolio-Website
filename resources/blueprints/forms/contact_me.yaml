tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              validate:
                - required
                - 'min:2'
                - 'max:100'
              placeholder: 'Your Name'
          -
            handle: email
            field:
              input_type: email
              type: text
              display: Email
              validate:
                - required
                - email
                - 'max:255'
              placeholder: 'Your Email'
          -
            handle: form_message
            field:
              type: textarea
              display: Message
              validate:
                - required
                - 'min:10'
                - 'max:2000'
              placeholder: 'Your Message'
          -
            handle: turnstile
            field:
              type: turnstile
              display: Verification
              theme: dark
